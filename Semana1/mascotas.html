<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Mascotas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Mis Mascotas</h1>
        <nav>
            <a href="index.html" class="btn-retorno">⬅ Volver al Portafolio</a>
        </nav>
    </header>

    <section class="galeria">
        
        <article class="tarjeta-mascota">
            <img src="Mascota/Lia-bebe.jpg" alt="Foto de la primera mascota">
            <h3>Lia bebe</h3>
            <p>Una cachorra de 2 meses aproximadamente.</p>
        </article>

        <article class="tarjeta-mascota">
            <img src="Mascota/Lia-navideña.jpg" alt="Foto de la segunda mascota">
            <h3>Lia Navideña</h3>
            <p>Lia diciembre 2020.</p>
        </article>

        <article class="tarjeta-mascota">
            <img src="Mascota/Lia.jpg" alt="Foto de la tercera mascota">
            <h3>Lia adulta</h3>
            <p>Una perra muy energica, cariñosa, guardina del hogar, le gustaba tomar el sol en las tardes.</p>
        </article>
